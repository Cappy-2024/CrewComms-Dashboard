<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Among Tracker Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="center-screen">
    <div class="logo">🏆 Among Tracker</div>
    <p class="subtitle">Sign in with Discord to manage your server's settings.</p>
    <a id="loginBtn" class="btn">Sign in with Discord</a>
  </div>

  <script src="config.js"></script>
  <script src="auth.js"></script>
  <script>
    // If already logged in, skip straight to guild selection
    if (Auth.getSession()) {
      window.location.href = 'guilds.html';
    }
    document.getElementById('loginBtn').href = Auth.loginUrl();
  </script>
</body>
</html>
